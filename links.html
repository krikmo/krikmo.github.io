<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src/black.ico" type="image/x-icon">
    <title>Link Converter</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #7cb9e8;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 8px;
            color: #ffffff;
            padding: 15px;
            font-size: 14px;
            resize: none;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #7cb9e8;
            box-shadow: 0 0 5px rgba(124, 185, 232, 0.3);
        }

        #linkContainer {
            width: 100%;
            text-align: justify;
        }

        .link-wrapper {
            display: flex;
            align-items: center;
            margin: 4px 0;
        }

        .delete-button {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: #666;
            border: none;
            background: transparent;
            font-size: 18px;
        }

        .link-wrapper:hover .delete-button {
            opacity: 1;
        }

        .delete-button:hover {
            color: #ff4444;
        }

        .link-item {
            display: block;
            color: #7cb9e8;
            text-decoration: none;
            padding: 8px 0;
            transition: color 0.3s ease;
            font-size: 14px;
            word-break: break-all;
            flex-grow: 1;
        }

        .link-item:hover {
            color: #a8d5ff;
        }

        /* Changed: Inline links retain the existing blue link appearance. */
        .inline-link {
            color: #7cb9e8;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        /* Changed: Inline links have their own hover behavior. */
        .inline-link:hover {
            color: #a8d5ff;
        }

        /* Changed: Ordinary text uses a neutral color instead of link blue. */
        .text-item {
            color: #d7d7d7;
            display: block;
            padding: 8px 0;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            flex-grow: 1;
        }

        /* Changed: Basic inline Markdown styling for ordinary text. */
        .text-item strong {
            color: #f1f1f1;
            display: inline;
            padding: 0;
            font-size: inherit;
            margin: 0;
        }

        .text-item em {
            color: #dce5ec;
        }

        .text-item del {
            color: #aeb4ba;
        }

        strong {
            color: #7cb9e8;
            display: block;
            padding: 8px 0;
            font-size: 16px;
            margin-top: 8px;
        }

        /* Changed: Headers remain aligned beside the delete button. */
        .link-wrapper > strong {
            flex-grow: 1;
        }

        hr {
            border: 0;
            border-top: 1px solid #404040;
            margin: 12px 0;
            width: 100%;
        }

        /* Changed: Separators expand beside their delete button. */
        .link-wrapper > hr {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Link Converter</h1>
        <textarea id="linkInput" placeholder="Paste links here, one per line..."></textarea>
        <div id="linkContainer"></div>
    </div>

    <script>
        // Applies the existing smart URL-prefix behavior.
        function prepareUrl(url) {
            let preparedUrl = url.trim();

            if (!preparedUrl.startsWith('http://') &&
                !preparedUrl.startsWith('https://') &&
                !preparedUrl.startsWith('file://')) {
                preparedUrl = 'https://' + preparedUrl;
            }

            return preparedUrl;
        }

        // Allows only complete standalone URLs or bare domains.
        function isStandaloneLink(value) {
            const trimmedValue = value.trim();

            if (trimmedValue.startsWith('file://')) {
                return true;
            }

            if (trimmedValue.startsWith('http://') ||
                trimmedValue.startsWith('https://')) {
                try {
                    const parsedUrl = new URL(trimmedValue);
                    return Boolean(parsedUrl.hostname);
                } catch (error) {
                    return false;
                }
            }

            // Bare domains are accepted when they occupy the entire line.
            return /^(?:www\.)?(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)\.)+[a-zA-Z]{2,}(?::\d{1,5})?(?:[/?#][^\s]*)?$/.test(trimmedValue);
        }

        // Creates a link using the page's existing link behavior.
        function createLinkElement(url, label, className) {
            const linkElement = document.createElement('a');
            linkElement.href = prepareUrl(url);
            linkElement.className = className;
            linkElement.textContent = label;
            linkElement.target = '_blank';
            linkElement.rel = 'noreferrer noopener';

            return linkElement;
        }

        // Removes one complete input line and one following blank line.
        function createDeleteButton(trimmedLine) {
            const deleteButton = document.createElement('button');
            deleteButton.className = 'delete-button';
            deleteButton.innerHTML = '×';

            deleteButton.onclick = function() {
                // Get current RAW lines and preserve empty lines.
                const currentLines = document.getElementById('linkInput').value.split('\n');

                // Find the first line with matching trimmed content.
                const lineIndex = currentLines.findIndex(l => l.trim() === trimmedLine);

                if (lineIndex > -1) {
                    // Remove the target line.
                    currentLines.splice(lineIndex, 1);

                    // Remove one following empty line if it exists.
                    if (lineIndex < currentLines.length &&
                        currentLines[lineIndex].trim() === '') {
                        currentLines.splice(lineIndex, 1);
                    }

                    // Update the textarea and refresh the rendered output.
                    document.getElementById('linkInput').value = currentLines.join('\n');
                    document.getElementById('linkInput').dispatchEvent(new Event('input'));
                }
            };

            return deleteButton;
        }

        // Converts Markdown links, styling, and inline URLs into safe elements.
        function appendInlineMarkdown(text, parent) {
            let index = 0;

            while (index < text.length) {
                const remainingText = text.slice(index);

                // Handle Markdown links: [Text](link.com).
                const markdownLinkMatch = remainingText.match(/^\[([^\]\n]+)\]\(([^)\n]+)\)/);

                if (markdownLinkMatch) {
                    const linkElement = createLinkElement(
                        markdownLinkMatch[2],
                        '',
                        'inline-link'
                    );

                    // Allow Markdown styling inside the link label.
                    appendInlineMarkdown(markdownLinkMatch[1], linkElement);
                    parent.appendChild(linkElement);
                    index += markdownLinkMatch[0].length;
                    continue;
                }

                // Handle bold text: **text** or __text__.
                const boldMatch = remainingText.match(/^(\*\*|__)(?=\S)([\s\S]*?\S)\1/);

                if (boldMatch) {
                    const strongElement = document.createElement('strong');
                    appendInlineMarkdown(boldMatch[2], strongElement);
                    parent.appendChild(strongElement);
                    index += boldMatch[0].length;
                    continue;
                }

                // Handle crossed-out text: ~~text~~.
                const strikeMatch = remainingText.match(/^~~(?=\S)([\s\S]*?\S)~~/);

                if (strikeMatch) {
                    const deleteElement = document.createElement('del');
                    appendInlineMarkdown(strikeMatch[1], deleteElement);
                    parent.appendChild(deleteElement);
                    index += strikeMatch[0].length;
                    continue;
                }

                // Handle italic text: *text* or _text_.
                const italicMatch = remainingText.match(/^(\*|_)(?=\S)([\s\S]*?\S)\1/);

                if (italicMatch) {
                    const italicElement = document.createElement('em');
                    appendInlineMarkdown(italicMatch[2], italicElement);
                    parent.appendChild(italicElement);
                    index += italicMatch[0].length;
                    continue;
                }

                // Handle inline HTTP, HTTPS, and file URLs.
                const rawUrlMatch = remainingText.match(/^(?:http:\/\/|https:\/\/|file:\/\/)[^\s<>"']+/);

                if (rawUrlMatch) {
                    let rawUrl = rawUrlMatch[0];
                    let trailingText = '';

                    // Keep common punctuation outside the clickable URL.
                    while (/[.,!?;:)]$/.test(rawUrl)) {
                        trailingText = rawUrl.slice(-1) + trailingText;
                        rawUrl = rawUrl.slice(0, -1);
                    }

                    if (rawUrl) {
                        parent.appendChild(
                            createLinkElement(rawUrl, rawUrl, 'inline-link')
                        );
                    }

                    if (trailingText) {
                        parent.appendChild(document.createTextNode(trailingText));
                    }

                    index += rawUrlMatch[0].length;
                    continue;
                }

                // Handle bare domains anywhere in ordinary text.
                const previousCharacter = index > 0 ? text[index - 1] : '';
                const validDomainBoundary =
                    index === 0 || !/[A-Za-z0-9@_-]/.test(previousCharacter);

                if (validDomainBoundary) {
                    const bareDomainMatch = remainingText.match(
                        /^(?:www\.)?(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)\.)+[a-zA-Z]{2,}(?::\d{1,5})?(?:[/?#][^\s<>"']*)?/
                    );

                    if (bareDomainMatch) {
                        let bareDomain = bareDomainMatch[0];
                        let trailingText = '';

                        // Keep common punctuation outside the clickable domain.
                        while (/[.,!?;:)]$/.test(bareDomain)) {
                            trailingText = bareDomain.slice(-1) + trailingText;
                            bareDomain = bareDomain.slice(0, -1);
                        }

                        if (bareDomain) {
                            parent.appendChild(
                                createLinkElement(bareDomain, bareDomain, 'inline-link')
                            );
                        }

                        if (trailingText) {
                            parent.appendChild(document.createTextNode(trailingText));
                        }

                        index += bareDomainMatch[0].length;
                        continue;
                    }
                }

                // Preserve ordinary text one character at a time.
                parent.appendChild(document.createTextNode(text[index]));
                index++;
            }
        }

        document.getElementById('linkInput').addEventListener('input', function() {
            // Get all lines including empty ones.
            const lines = this.value.split('\n');
            const linkContainer = document.getElementById('linkContainer');
            linkContainer.innerHTML = '';

            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return; // Skip empty lines.

                const wrapper = document.createElement('div');
                wrapper.className = 'link-wrapper';

                // Every non-empty line receives a delete button.
                const deleteButton = createDeleteButton(trimmedLine);

                // Handle headers (# prefix).
                if (trimmedLine.startsWith('#')) {
                    const headerElement = document.createElement('strong');
                    headerElement.textContent = line; // Preserve original spacing.
                    wrapper.appendChild(deleteButton);
                    wrapper.appendChild(headerElement);
                }
                // Handle separators (---).
                else if (/^-{3,}$/.test(trimmedLine)) {
                    const hr = document.createElement('hr');
                    hr.style.borderColor = '#404040';
                    wrapper.appendChild(deleteButton);
                    wrapper.appendChild(hr);
                }
                // Handle standalone links and inline Markdown/text content.
                else {
                    // Standalone URLs retain the original full-link appearance.
                    if (isStandaloneLink(trimmedLine)) {
                        const linkElement = createLinkElement(
                            trimmedLine,
                            line,
                            'link-item'
                        );

                        wrapper.appendChild(deleteButton);
                        wrapper.appendChild(linkElement);
                    }
                    // Other lines become styled text with inline Markdown support.
                    else {
                        const textElement = document.createElement('div');
                        textElement.className = 'text-item';
                        appendInlineMarkdown(line, textElement);

                        wrapper.appendChild(deleteButton);
                        wrapper.appendChild(textElement);
                    }
                }

                linkContainer.appendChild(wrapper);
            });
        });
    </script>
</body>
</html>
